    <style>
      /* Critical CSS for initial load */
      html {
        background-color: #0a0a0f;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #0a0a0f;
        color: #ffffff;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #root {
        min-height: 100vh;
      }
      /* Loading state */
      .initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0f;
        z-index: 9999;
      }
      .initial-loader.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- Initial Loader (removed by React) -->
    <div class="initial-loader" id="initial-loader">
      <div style="width: 40px; height: 40px; border: 3px solid rgba(139, 92, 246, 0.3); border-top-color: #8b5cf6; border-radius: 50%; animation: spin 1s linear infinite;"></div>
    </div>
    <style>
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Remove initial loader when React loads
      window.addEventListener('load', function() {
        setTimeout(function() {
          var loader = document.getElementById('initial-loader');
          if (loader) {
            loader.classList.add('hidden');
          }
        }, 500);
      });
    </script>
  </body>
</html>
